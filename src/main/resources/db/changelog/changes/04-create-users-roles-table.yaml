databaseChangeLog:
  - changeSet:
      id: create-users-roles-table
      author: denys
      changes:
        - createTable:
            tableName: users_roles
            columns:
              - column:
                  name: user_id
                  type: bigint
                  constraints:
                    nullable: false
                    foreignKeyName: fk_users_roles_user_id
                    references: users(id)
                    primaryKey: true
              - column:
                 name: role_id
                 type: bigint
                 constraints:
                   nullable: false
                   foreignKeyName: fk_users_roles_role_id
                   references: roles(id)
                   primaryKey: true

